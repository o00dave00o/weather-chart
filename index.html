<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Chart</title>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #09090b;            /* Dense engineering matte black */
      --card-bg: #121215;       /* Instrument panel surface */
      --card-hover: #18181b;    /* Active instrument surface */
      --border: #27272a;        /* Precision panel borders */
      --border-active: #52525b; /* Active state border */
      --text: #fafafa;          /* High contrast readout white */
      --muted: #71717a;         /* Muted telemetry grey */
      --accent: #2563eb;        /* Functional instrument blue */
      --accent-subtle: rgba(37, 99, 235, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1680px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 16px;
    }

    .controls {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .search-group {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    .search-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--border-active);
    }

    .geo-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.15s ease;
    }

    .geo-btn:hover {
      border-color: var(--border-active);
      background: var(--card-hover);
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 44px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 4px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.9);
      display: none;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--card-hover);
    }

    .suggestion-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-name {
      font-weight: 500;
      color: var(--text);
      font-size: 0.95rem;
    }

    .suggestion-coords {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    .suggestion-details {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Text Forecast Card Styles */
    .text-forecast-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }

    @media (max-width: 1100px) {
      .forecast-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .forecast-day-col {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .forecast-day-col:hover {
      border-color: var(--border-active);
      background: var(--card-hover);
    }

    .forecast-day-col.active {
      border-color: var(--text);
      background: #18181b;
    }

    .forecast-day-name {
      font-weight: 600;
      color: var(--text);
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .forecast-metric {
      display: flex;
      flex-direction: column;
    }

    .forecast-metric .label {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .forecast-metric .val {
      font-weight: 500;
      font-size: 0.85rem;
      color: var(--text);
      font-family: ui-monospace, monospace;
    }

    .forecast-metric.temp .val { color: #22c55e; }
    .forecast-metric.rain .val { color: #3b82f6; }
    .forecast-metric.wind .val { color: #ef4444; }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
    }

    .error-msg {
      display: none;
      background: #270606;
      color: #f87171;
      border: 1px solid #7f1d1d;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="controls">
      <div class="search-group">
        <label for="search-input">Location Search</label>
        <div class="search-input-wrapper">
          <input type="text" id="search-input" placeholder="Enter station or locality..." autocomplete="off" />
          <button type="button" id="geo-btn" class="geo-btn" title="Use current location">◎</button>
          <div id="suggestions" class="suggestions-list"></div>
        </div>
      </div>
    </div>

    <div id="error" class="error-msg"></div>

    <div class="text-forecast-card">
      <div class="forecast-grid" id="text-forecast-grid"></div>
    </div>

    <div class="chart-card">
      <div class="chart-container">
        <canvas id="weatherChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const MODEL_CONFIG = [
      { id: 'ecmwf_ifs025', label: 'ECMWF', color: '#60a5fa' },
      { id: 'gfs_seamless', label: 'GFS (NOAA)', color: '#f87171' },
      { id: 'icon_seamless', label: 'ICON (DWD)', color: '#fbbf24' },
      { id: 'ukmo_seamless', label: 'UKMO', color: '#34d399' },
      { id: 'meteofrance_seamless', label: 'MeteoFrance', color: '#c084fc' },
      { id: 'gem_seamless', label: 'GEM (Canada)', color: '#fb923c' },
      { id: 'jma_seamless', label: 'JMA (Japan)', color: '#22d3ee' },
      { id: 'dwd_icon_eu', label: 'ICON-EU', color: '#f472b6' },
      { id: 'arpege_world', label: 'ARPEGE', color: '#818cf8' },
      { id: 'gfs_global', label: 'GFS Global', color: '#9ca3af' }
    ];

    let currentLat = 51.5074;
    let currentLng = -0.1278;
    let currentLocationLabel = "London, Greater London, United Kingdom";
    let selectedDate = new Date().toISOString().split('T')[0];
    let isFetching = false;
    let weatherChartInstance = null;
    let searchDebounceTimeout = null;
    let activeAbortController = null;
    let cachedResults = null;

    const searchInput = document.getElementById('search-input');
    const geoBtn = document.getElementById('geo-btn');
    const suggestionsList = document.getElementById('suggestions');
    const errorDiv = document.getElementById('error');
    const textForecastGrid = document.getElementById('text-forecast-grid');

    const nowMarkerPlugin = {
      id: 'nowMarker',
      afterDraw(chart) {
        const todayIso = new Date().toISOString().split('T')[0];
        const isToday = (selectedDate === todayIso);
        const currentHour = isToday ? new Date().getHours() : 12;

        const ctx = chart.ctx;
        const chartArea = chart.chartArea;
        if (!chartArea) return;

        // 1. Draw the vertical "NOW" line if viewing today
        if (isToday) {
          const xMeta = chart.getDatasetMeta(0);
          if (xMeta && xMeta.data && xMeta.data[currentHour]) {
            const xCoord = xMeta.data[currentHour].x;
            const topY = chart.scales.yTemp.top;
            const bottomY = chart.scales.yTemp.bottom;

            ctx.save();
            ctx.beginPath();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#ef4444';
            ctx.setLineDash([2, 2]);
            ctx.moveTo(xCoord, topY);
            ctx.lineTo(xCoord, bottomY);
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.font = '500 10px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('NOW', xCoord, topY - 6);
            ctx.restore();
          }
        }

        // 2. Draw Current Telemetry Badge (Inline for landscape/desktop, Stacked for portrait)
        if (!cachedResults) return;
        const startDate = new Date().toISOString().split('T')[0];
        const dayOffset = Math.max(0, Math.min(7, Math.round((new Date(selectedDate).getTime() - new Date(startDate).getTime()) / (1000 * 60 * 60 * 24))));
        const hourIdx = (dayOffset * 24) + currentHour;

        const ukmoRes = cachedResults.find(r => r.modelId === 'ukmo_seamless') || cachedResults[0];
        if (!ukmoRes) return;

        const temp = ukmoRes.temps[hourIdx];
        const rain = ukmoRes.rains[hourIdx];
        const wind = ukmoRes.winds[hourIdx];

        if (temp == null && rain == null && wind == null) return;

        const tempStr = temp != null ? `${Math.round(temp)}°C` : 'N/A';
        const rainStr = rain != null ? `${rain.toFixed(1)}mm` : 'N/A';
        const windStr = wind != null ? `${Math.round(wind)}mph` : 'N/A';

        ctx.save();
        ctx.font = '500 11px ui-monospace, monospace';

        const isPortrait = chart.width < 600 || window.innerHeight > window.innerWidth;

        const parts = [
          { label: 'Temp: ', val: tempStr, color: '#22c55e' },
          { label: 'Rain: ', val: rainStr, color: '#3b82f6' },
          { label: 'Wind: ', val: windStr, color: '#ef4444' }
        ];

        const paddingX = 12;
        let boxWidth, boxHeight;

        if (isPortrait) {
          boxWidth = 110;
          boxHeight = 68;
        } else {
          let totalTextWidth = 0;
          parts.forEach((p, idx) => {
            totalTextWidth += ctx.measureText(p.label + p.val).width;
            if (idx < parts.length - 1) totalTextWidth += ctx.measureText('  |  ').width;
          });
          boxWidth = totalTextWidth + (paddingX * 2);
          boxHeight = 26;
        }

        // Position: Left if afternoon (>= 12), Right if before noon (< 12)
        const boxX = (currentHour >= 12) ? (chartArea.left + 12) : (chartArea.right - boxWidth - 12);
        const boxY = chartArea.top + 12;

        // Draw background card matching theme
        ctx.fillStyle = '#121215';
        ctx.strokeStyle = '#27272a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 4);
        } else {
          ctx.rect(boxX, boxY, boxWidth, boxHeight);
        }
        ctx.fill();
        ctx.stroke();

        ctx.textBaseline = 'middle';

        if (isPortrait) {
          const rowHeight = boxHeight / 3;
          parts.forEach((p, idx) => {
            const rowCenterY = boxY + (rowHeight * idx) + (rowHeight / 2);
            let cursorX = boxX + paddingX;

            ctx.fillStyle = '#71717a';
            ctx.fillText(p.label, cursorX, rowCenterY);
            cursorX += ctx.measureText(p.label).width;

            ctx.fillStyle = p.color;
            ctx.fillText(p.val, cursorX, rowCenterY);
          });
        } else {
          let cursorX = boxX + paddingX;
          const centerY = boxY + (boxHeight / 2);

          parts.forEach((p, idx) => {
            ctx.fillStyle = '#71717a';
            ctx.fillText(p.label, cursorX, centerY);
            cursorX += ctx.measureText(p.label).width;

            ctx.fillStyle = p.color;
            ctx.fillText(p.val, cursorX, centerY);
            cursorX += ctx.measureText(p.val).width;

            if (idx < parts.length - 1) {
              ctx.fillStyle = '#27272a';
              ctx.fillText('  |  ', cursorX, centerY);
              cursorX += ctx.measureText('  |  ').width;
            }
          });
        }

        ctx.restore();
      }
    };

    function init() {
      searchInput.addEventListener('input', handleSearchInput);
      geoBtn.addEventListener('click', handleGeolocation);

      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target) && !geoBtn.contains(e.target)) {
          suggestionsList.style.display = 'none';
        }
      });

      autoDetectLocationOnStartup();
    }

    function autoDetectLocationOnStartup() {
      if (!navigator.geolocation) {
        searchInput.value = currentLocationLabel;
        fetchAllData();
        return;
      }

      searchInput.value = "Acquiring location...";
      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;
          currentLocationLabel = `Coordinates (${currentLat.toFixed(2)}°, ${currentLng.toFixed(2)}°)`;
          searchInput.value = currentLocationLabel;
          selectedDate = new Date().toISOString().split('T')[0];
          fetchAllData();
        },
        () => {
          searchInput.value = currentLocationLabel;
          fetchAllData();
        },
        { timeout: 10000, maximumAge: 60000 }
      );
    }

    function handleGeolocation() {
      if (isFetching) return;
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser");
        return;
      }
      searchInput.value = "Acquiring location telemetry...";
      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;
          currentLocationLabel = `Coordinates (${currentLat.toFixed(2)}°, ${currentLng.toFixed(2)}°)`;
          searchInput.value = currentLocationLabel;
          selectedDate = new Date().toISOString().split('T')[0];
          fetchAllData();
        },
        () => {
          alert("Unable to retrieve your location.");
          searchInput.value = currentLocationLabel;
        },
        { timeout: 10000, maximumAge: 60000 }
      );
    }

    function handleSearchInput(e) {
      clearTimeout(searchDebounceTimeout);
      const query = e.target.value.trim();
      if (query.length < 2) {
        suggestionsList.style.display = 'none';
        return;
      }

      searchDebounceTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`);
          const data = await res.json();
          if (!data.results || data.results.length === 0) {
            suggestionsList.innerHTML = `<div class="suggestion-item"><span class="suggestion-name">No locations found</span></div>`;
            suggestionsList.style.display = 'block';
            return;
          }
          renderSuggestions(data.results);
        } catch (err) {
          console.error("Geocoding failed", err);
        }
      }, 250);
    }

    function renderSuggestions(results) {
      suggestionsList.innerHTML = '';
      results.forEach(loc => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        const hierarchy = [loc.admin3, loc.admin2, loc.admin1, loc.country].filter((v, i, arr) => v && arr.indexOf(v) === i);
        const detailText = hierarchy.join(', ');
        const fullLabel = `${loc.name} (${detailText || 'UK'})`;

        item.innerHTML = `
          <div class="suggestion-title">
            <span class="suggestion-name">${loc.name}</span>
            <span class="suggestion-coords">${loc.latitude.toFixed(2)}°, ${loc.longitude.toFixed(2)}°</span>
          </div>
          <span class="suggestion-details">${detailText || 'Location'}</span>
        `;

        item.addEventListener('click', () => {
          if (isFetching) return;
          currentLat = loc.latitude;
          currentLng = loc.longitude;
          currentLocationLabel = fullLabel;
          searchInput.value = fullLabel;
          suggestionsList.style.display = 'none';
          selectedDate = new Date().toISOString().split('T')[0];
          fetchAllData();
        });
        suggestionsList.appendChild(item);
      });
      suggestionsList.style.display = 'block';
    }

    async function fetchWithRetry(url, signal, retries = 2, delay = 600) {
      for (let i = 0; i <= retries; i++) {
        try {
          const res = await fetch(url, { signal });
          if (res.ok) return await res.json();
        } catch (err) {
          if (err.name === 'AbortError') throw err;
          if (i === retries) throw err;
        }
        await new Promise(resolve => setTimeout(resolve, delay));
      }
      return null;
    }

    async function fetchAllData() {
      if (isFetching) return;
      isFetching = true;

      if (activeAbortController) activeAbortController.abort();
      activeAbortController = new AbortController();
      const { signal } = activeAbortController;

      errorDiv.style.display = 'none';
      
      const oldVal = searchInput.value;
      if (!oldVal.includes("Fetching")) {
        searchInput.value = `${currentLocationLabel} [Fetching datasets...]`;
      }

      const startDate = new Date().toISOString().split('T')[0];
      const dEnd = new Date(startDate);
      dEnd.setDate(dEnd.getDate() + 7);
      const endDate = dEnd.toISOString().split('T')[0];

      const hours = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);

      const fetchPromises = MODEL_CONFIG.map(async (model) => {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLng}&hourly=temperature_2m,precipitation,windspeed_10m&start_date=${startDate}&end_date=${endDate}&timezone=auto&models=${model.id}`;
        try {
          const json = await fetchWithRetry(url, signal);
          if (!json || !json.hourly || !json.hourly.time) return null;

          const temps = json.hourly[`temperature_2m_${model.id}`] || json.hourly['temperature_2m'] || [];
          const rains = json.hourly[`precipitation_${model.id}`] || json.hourly['precipitation'] || [];
          const rawWinds = json.hourly[`windspeed_10m_${model.id}`] || json.hourly['windspeed_10m'] || [];
          const windsMph = rawWinds.map(w => w !== null ? w * 0.621371 : null);

          return { modelId: model.id, temps, rains, winds: windsMph };
        } catch (err) {
          return null;
        }
      });

      let results;
      try {
        results = await Promise.all(fetchPromises);
      } catch (err) {
        isFetching = false;
        searchInput.value = currentLocationLabel;
        return;
      }

      if (signal.aborted) {
        isFetching = false;
        return;
      }

      searchInput.value = currentLocationLabel;
      isFetching = false;

      const validResults = results.filter(r => r !== null);
      if (validResults.length === 0) {
        errorDiv.innerText = 'Error loading forecast datasets. Please verify location parameters.';
        errorDiv.style.display = 'block';
        return;
      }

      cachedResults = validResults;
      renderTextForecast(validResults, startDate);
      renderDailyChartForSelectedDate(validResults, hours);
    }

    function renderTextForecast(allResults, startDate) {
      textForecastGrid.innerHTML = '';
      const daysCount = 8;
      const ukmoResult = allResults.find(r => r.modelId === 'ukmo_seamless') || allResults[0];

      for (let d = 0; d < daysCount; d++) {
        const targetDateObj = new Date(startDate);
        targetDateObj.setDate(targetDateObj.getDate() + d);
        const isoDate = targetDateObj.toISOString().split('T')[0];
        const dayLabel = d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : targetDateObj.toLocaleDateString('en-GB', { weekday: 'short' });

        let dayMax = -Infinity;
        let dayMin = Infinity;
        let totalRain = 0;
        let peakWind = 0;

        if (ukmoResult) {
          const startIdx = d * 24;
          const endIdx = startIdx + 24;
          const dayTemps = ukmoResult.temps.slice(startIdx, endIdx).filter(v => v != null);
          const dayRains = ukmoResult.rains.slice(startIdx, endIdx).filter(v => v != null);
          const dayWinds = ukmoResult.winds.slice(startIdx, endIdx).filter(v => v != null);

          if (dayTemps.length > 0) {
            dayMax = Math.max(...dayTemps);
            dayMin = Math.min(...dayTemps);
          }
          if (dayRains.length > 0) totalRain = dayRains.reduce((a, b) => a + b, 0);
          if (dayWinds.length > 0) peakWind = Math.max(...dayWinds);
        }

        const col = document.createElement('div');
        col.className = `forecast-day-col ${isoDate === selectedDate ? 'active' : ''}`;
        col.dataset.date = isoDate;

        if (!ukmoResult || dayMax === -Infinity) {
          col.innerHTML = `
            <div class="forecast-day-name">${dayLabel}</div>
            <div class="forecast-metric"><span class="label">No Data</span></div>
          `;
        } else {
          col.innerHTML = `
            <div class="forecast-day-name">${dayLabel}</div>
            <div class="forecast-metric temp">
              <span class="label">Min / Max</span>
              <span class="val">${Math.round(dayMin)}° / ${Math.round(dayMax)}°</span>
            </div>
            <div class="forecast-metric rain">
              <span class="label">Rain</span>
              <span class="val">${Math.round(totalRain)}mm</span>
            </div>
            <div class="forecast-metric wind">
              <span class="label">Wind</span>
              <span class="val">${Math.round(peakWind)}mph</span>
            </div>
          `;
        }

        col.addEventListener('click', () => {
          if (isFetching || !cachedResults) return;
          document.querySelectorAll('.forecast-day-col').forEach(c => c.classList.remove('active'));
          col.classList.add('active');
          selectedDate = isoDate;
          const hours = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);
          renderDailyChartForSelectedDate(cachedResults, hours);
        });

        textForecastGrid.appendChild(col);
      }
    }

    function getLogicalScaleBounds(rawMin, rawMax, targetSteps = 5) {
      const range = rawMax - rawMin || 1;
      const roughStep = range / targetSteps;
      
      const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
      const normalizedStep = roughStep / magnitude;
      
      let niceStep = 1;
      if (normalizedStep <= 1.5) niceStep = 1;
      else if (normalizedStep <= 3) niceStep = 2;
      else if (normalizedStep <= 7) niceStep = 5;
      else niceStep = 10;
      
      const stepSize = niceStep * magnitude;
      const min = Math.floor(rawMin / stepSize) * stepSize;
      const max = Math.ceil(rawMax / stepSize) * stepSize;
      
      return { min: min === max ? min - stepSize : min, max: min === max ? max + stepSize : max, stepSize };
    }

    function renderDailyChartForSelectedDate(allResults, hours) {
      const startDate = new Date().toISOString().split('T')[0];
      const dayOffset = Math.max(0, Math.min(7, Math.round((new Date(selectedDate).getTime() - new Date(startDate).getTime()) / (1000 * 60 * 60 * 24))));

      let globalTempMin = Infinity;
      let globalTempMax = -Infinity;
      let globalRainMax = -Infinity;
      let globalWindMax = -Infinity;

      allResults.forEach(r => {
        r.temps.forEach(val => {
          if (val != null) {
            if (val < globalTempMin) globalTempMin = val;
            if (val > globalTempMax) globalTempMax = val;
          }
        });
        r.rains.forEach(val => {
          if (val != null) {
            if (val > globalRainMax) globalRainMax = val;
          }
        });
        r.winds.forEach(val => {
          if (val != null) {
            if (val > globalWindMax) globalWindMax = val;
          }
        });
      });

      const tempBounds = getLogicalScaleBounds(globalTempMin - 1, globalTempMax + 1, 5);
      const rainBounds = getLogicalScaleBounds(0, Math.max(2, (globalRainMax || 0) * 1.2), 4);
      const windBounds = getLogicalScaleBounds(0, globalWindMax + 4, 5);

      const resultsMap = new Map();
      allResults.forEach(r => {
        const startIdx = dayOffset * 24;
        const endIdx = startIdx + 24;
        resultsMap.set(r.modelId, {
          temps: r.temps.slice(startIdx, endIdx),
          rains: r.rains.slice(startIdx, endIdx),
          winds: r.winds.slice(startIdx, endIdx)
        });
      });

      function computeDailyExtremes(metricKey) {
        const mins = Array(24).fill(Infinity);
        const maxs = Array(24).fill(-Infinity);

        for (let i = 0; i < 24; i++) {
          MODEL_CONFIG.forEach(m => {
            const res = resultsMap.get(m.id);
            if (res && res[metricKey][i] != null) {
              const val = res[metricKey][i];
              if (val < mins[i]) mins[i] = val;
              if (val > maxs[i]) maxs[i] = val;
            }
          });
          if (mins[i] === Infinity) mins[i] = null;
          if (maxs[i] === -Infinity) maxs[i] = null;
        }
        return { mins, maxs };
      }

      const tempExtremes = computeDailyExtremes('temps');
      const rainExtremes = computeDailyExtremes('rains');
      const windExtremes = computeDailyExtremes('winds');

      const datasets = [
        { type: 'line', data: tempExtremes.mins, borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, yAxisID: 'yTemp' },
        { type: 'line', data: tempExtremes.maxs, borderColor: 'transparent', backgroundColor: 'rgba(34, 197, 94, 0.05)', pointRadius: 0, fill: '-1', yAxisID: 'yTemp' },

        { type: 'line', data: rainExtremes.mins, borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, yAxisID: 'yRain' },
        { type: 'line', data: rainExtremes.maxs, borderColor: 'transparent', backgroundColor: 'rgba(59, 130, 246, 0.05)', pointRadius: 0, fill: '-1', yAxisID: 'yRain' },

        { type: 'line', data: windExtremes.mins, borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, yAxisID: 'yWind' },
        { type: 'line', data: windExtremes.maxs, borderColor: 'transparent', backgroundColor: 'rgba(239, 68, 68, 0.05)', pointRadius: 0, fill: '-1', yAxisID: 'yWind' }
      ];

      MODEL_CONFIG.forEach(model => {
        const res = resultsMap.get(model.id);
        const temps = res ? res.temps : Array(24).fill(null);
        const rains = res ? res.rains : Array(24).fill(null);
        const winds = res ? res.winds : Array(24).fill(null);

        const isUKMO = model.id === 'ukmo_seamless';

        const tempColor = isUKMO ? '#22c55e' : '#22c55e26';
        const rainColor = isUKMO ? '#3b82f6' : '#3b82f626';
        const windColor = isUKMO ? '#ef4444' : '#ef444426';

        datasets.push(
          {
            type: 'line',
            label: `${model.label} (Temp)`,
            data: temps,
            backgroundColor: tempColor,
            borderColor: tempColor,
            pointRadius: isUKMO ? 4 : 1.5,
            fill: false,
            borderWidth: isUKMO ? 2.5 : 1,
            yAxisID: 'yTemp'
          },
          {
            type: 'line',
            label: `${model.label} (Rain)`,
            data: rains,
            backgroundColor: rainColor,
            borderColor: rainColor,
            borderWidth: isUKMO ? 2 : 1,
            borderDash: isUKMO ? [] : [2, 2],
            pointRadius: isUKMO ? 3.5 : 1,
            fill: false,
            yAxisID: 'yRain'
          },
          {
            type: 'line',
            label: `${model.label} (Wind)`,
            data: winds,
            backgroundColor: windColor,
            borderColor: windColor,
            borderWidth: isUKMO ? 1.5 : 1,
            pointRadius: isUKMO ? 3.5 : 1,
            fill: false,
            yAxisID: 'yWind'
          }
        );
      });

      const ctx = document.getElementById('weatherChart').getContext('2d');
      if (weatherChartInstance) weatherChartInstance.destroy();

      weatherChartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: hours, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 16 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#18181b',
              titleColor: '#fafafa',
              bodyColor: '#d4d4d8',
              borderColor: '#27272a',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                title: (items) => items.length ? `UTC Time: ${items[0].label}` : '',
                label: (ctx) => {
                  if (ctx.dataset.label === undefined || ctx.dataset.label.includes('undefined')) return null;
                  const yAxis = ctx.dataset.yAxisID;
                  const labelName = ctx.dataset.label.replace(' (Temp)', '').replace(' (Rain)', '').replace(' (Wind)', '');
                  if (yAxis === 'yTemp') return `${labelName} Temperature: ${Math.round(ctx.parsed.y)}°C`;
                  if (yAxis === 'yRain') return `${labelName} Precipitation: ${ctx.parsed.y.toFixed(1)} mm`;
                  return `${labelName} Wind Speed: ${Math.round(ctx.parsed.y)} mph`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#27272a' },
              ticks: { color: '#71717a', font: { size: 11, family: 'ui-monospace, monospace' } }
            },
            yTemp: {
              type: 'linear',
              position: 'left',
              min: tempBounds.min,
              max: tempBounds.max,
              ticks: { 
                color: '#22c55e', 
                stepSize: tempBounds.stepSize,
                font: { family: 'ui-monospace, monospace', size: 11 },
                callback: (val) => Math.round(val)
              },
              grid: { color: '#27272a' },
              title: { display: true, text: 'TEMPERATURE (°C)', color: '#22c55e', font: { weight: '600', size: 10 } }
            },
            yRain: {
              type: 'linear',
              position: 'right',
              min: rainBounds.min,
              max: rainBounds.max,
              ticks: { 
                color: '#3b82f6', 
                stepSize: rainBounds.stepSize,
                font: { family: 'ui-monospace, monospace', size: 11 },
                callback: (val) => Number.isInteger(val) ? val : val.toFixed(1)
              },
              grid: { drawOnChartArea: false },
              title: { display: true, text: 'PRECIPITATION (MM)', color: '#3b82f6', font: { weight: '600', size: 10 } }
            },
            yWind: {
              type: 'linear',
              position: 'right',
              min: windBounds.min,
              max: windBounds.max,
              ticks: { 
                color: '#ef4444', 
                stepSize: windBounds.stepSize,
                font: { family: 'ui-monospace, monospace', size: 11 },
                callback: (val) => Math.round(val)
              },
              grid: { drawOnChartArea: false },
              title: { display: true, text: 'WIND SPEED (MPH)', color: '#ef4444', font: { weight: '600', size: 10 } }
            }
          }
        },
        plugins: [nowMarkerPlugin]
      });
    }

    window.onload = init;
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered successfully!', reg.scope))
          .catch((err) => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
