<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Chart</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #050505;            /* Deep black canvas */
      --card-bg: #121212;       /* Subtle off-black cards */
      --border: #262626;        /* Subtle dark borders */
      --text: #f5f5f5;          /* Crisp light text */
      --muted: #a3a3a3;         /* Neutral grey labels */
      --accent: #3b82f6;        /* Clean accent blue */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .controls {
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }

    .search-group {
      position: relative;
      flex: 1;
      min-width: 320px;
      max-width: 520px;
    }

    .search-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .geo-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .geo-btn:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 6px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
      display: none;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--bg);
    }

    .suggestion-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-name {
      font-weight: 600;
      color: var(--text);
      font-size: 1.05rem;
    }

    .suggestion-coords {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: monospace;
    }

    .suggestion-details {
      font-size: 0.9rem;
      color: var(--accent);
    }

    .location-info {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
      text-align: right;
      margin-left: auto;
    }

    /* Text Forecast Card Styles */
    .text-forecast-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    @media (max-width: 1100px) {
      .forecast-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .forecast-day-col {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .forecast-day-col:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
    }

    .forecast-day-col.active {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }

    .forecast-day-name {
      font-weight: 600;
      color: var(--accent);
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .forecast-condition {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 4px;
      border-radius: 4px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .cond-stormy { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .cond-heavy-rain { background: rgba(96, 165, 250, 0.2); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.4); }
    .cond-showers { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    .cond-overcast { background: rgba(156, 163, 175, 0.15); color: #d1d5db; border: 1px solid rgba(156, 163, 175, 0.3); }
    .cond-clear { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .cond-partly-cloudy { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

    .forecast-metric {
      display: flex;
      flex-direction: column;
    }

    .forecast-metric .label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .forecast-metric .val {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .forecast-metric.rain .val { color: #60a5fa; }
    .forecast-metric.wind .val { color: #34d399; }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 450px;
    }

    .error-msg {
      display: none;
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="controls">
      <div class="search-group">
        <label for="search-input">Search Location (Town/City/County):</label>
        <div class="search-input-wrapper">
          <input type="text" id="search-input" placeholder="..." autocomplete="off" />
          <button type="button" id="geo-btn" class="geo-btn" title="Use current location">📍</button>
          <div id="suggestions" class="suggestions-list"></div>
        </div>
      </div>

      <div class="location-info" id="location-text">Loading location...</div>
    </div>

    <div id="error" class="error-msg"></div>

    <div class="text-forecast-card">
      <div class="forecast-grid" id="text-forecast-grid"></div>
    </div>

    <div class="chart-card">
      <div class="chart-container">
        <canvas id="weatherChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const MODEL_CONFIG = [
      { id: 'ecmwf_ifs025', label: 'ECMWF', color: '#60a5fa' },
      { id: 'gfs_seamless', label: 'GFS (NOAA)', color: '#f87171' },
      { id: 'icon_seamless', label: 'ICON (DWD)', color: '#fbbf24' },
      { id: 'ukmo_seamless', label: 'UKMO', color: '#34d399' },
      { id: 'meteofrance_seamless', label: 'MeteoFrance', color: '#c084fc' },
      { id: 'gem_seamless', label: 'GEM (Canada)', color: '#fb923c' },
      { id: 'jma_seamless', label: 'JMA (Japan)', color: '#22d3ee' },
      { id: 'dwd_icon_eu', label: 'ICON-EU', color: '#f472b6' },
      { id: 'arpege_world', label: 'ARPEGE', color: '#818cf8' },
      { id: 'gfs_global', label: 'GFS Global', color: '#9ca3af' }
    ];

    let currentLat = 51.5074;
    let currentLng = -0.1278;
    let currentLocationLabel = "London, Greater London, United Kingdom";
    let selectedDate = new Date().toISOString().split('T')[0];
    let isFetching = false;
    let weatherChartInstance = null;
    let searchDebounceTimeout = null;
    let activeAbortController = null;
    let cachedResults = null;

    const searchInput = document.getElementById('search-input');
    const geoBtn = document.getElementById('geo-btn');
    const suggestionsList = document.getElementById('suggestions');
    const locationText = document.getElementById('location-text');
    const errorDiv = document.getElementById('error');
    const textForecastGrid = document.getElementById('text-forecast-grid');

    const nowMarkerPlugin = {
      id: 'nowMarker',
      afterDraw(chart) {
        const todayIso = new Date().toISOString().split('T')[0];
        if (selectedDate !== todayIso) return;

        const currentHour = new Date().getHours();
        const ctx = chart.ctx;
        const xMeta = chart.getDatasetMeta(0);
        if (!xMeta || !xMeta.data || !xMeta.data[currentHour]) return;

        const xCoord = xMeta.data[currentHour].x;
        const topY = chart.scales.yTemp.top;
        const bottomY = chart.scales.yTemp.bottom;

        ctx.save();
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#f43f5e';
        ctx.setLineDash([4, 4]);
        ctx.moveTo(xCoord, topY);
        ctx.lineTo(xCoord, bottomY);
        ctx.stroke();

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('NOW', xCoord, topY - 6);
        ctx.restore();
      }
    };

    function init() {
      searchInput.addEventListener('input', handleSearchInput);
      geoBtn.addEventListener('click', handleGeolocation);

      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target) && !geoBtn.contains(e.target)) {
          suggestionsList.style.display = 'none';
        }
      });

      fetchAllData();
    }

    function handleGeolocation() {
      if (isFetching) return;
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser");
        return;
      }
      locationText.innerText = "Detecting current location...";
      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;
          currentLocationLabel = `Current Location (${currentLat.toFixed(2)}°, ${currentLng.toFixed(2)}°)`;
          searchInput.value = currentLocationLabel;
          selectedDate = new Date().toISOString().split('T')[0];
          fetchAllData();
        },
        () => {
          alert("Unable to retrieve your location.");
          locationText.innerText = currentLocationLabel;
        },
        { timeout: 10000, maximumAge: 60000 }
      );
    }

    function handleSearchInput(e) {
      clearTimeout(searchDebounceTimeout);
      const query = e.target.value.trim();
      if (query.length < 2) {
        suggestionsList.style.display = 'none';
        return;
      }

      searchDebounceTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`);
          const data = await res.json();
          if (!data.results || data.results.length === 0) {
            suggestionsList.innerHTML = `<div class="suggestion-item"><span class="suggestion-name">No locations found</span></div>`;
            suggestionsList.style.display = 'block';
            return;
          }
          renderSuggestions(data.results);
        } catch (err) {
          console.error("Geocoding failed", err);
        }
      }, 250);
    }

    function renderSuggestions(results) {
      suggestionsList.innerHTML = '';
      results.forEach(loc => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        const hierarchy = [];
        if (loc.admin3) hierarchy.push(loc.admin3);
        if (loc.admin2 && loc.admin2 !== loc.admin3) hierarchy.push(loc.admin2);
        if (loc.admin1 && loc.admin1 !== loc.admin2) hierarchy.push(loc.admin1);
        if (loc.country) hierarchy.push(loc.country);

        const detailText = hierarchy.join(', ');
        const fullLabel = `${loc.name} (${detailText || 'UK'})`;

        item.innerHTML = `
          <div class="suggestion-title">
            <span class="suggestion-name">${loc.name}</span>
            <span class="suggestion-coords">${loc.latitude.toFixed(2)}°, ${loc.longitude.toFixed(2)}°</span>
          </div>
          <span class="suggestion-details">${detailText || 'Location'}</span>
        `;

        item.addEventListener('click', () => {
          if (isFetching) return;
          currentLat = loc.latitude;
          currentLng = loc.longitude;
          currentLocationLabel = fullLabel;
          searchInput.value = fullLabel;
          suggestionsList.style.display = 'none';
          selectedDate = new Date().toISOString().split('T')[0];
          fetchAllData();
        });
        suggestionsList.appendChild(item);
      });
      suggestionsList.style.display = 'block';
    }

    async function fetchWithRetry(url, signal, retries = 2, delay = 600) {
      for (let i = 0; i <= retries; i++) {
        try {
          const res = await fetch(url, { signal });
          if (res.ok) return await res.json();
        } catch (err) {
          if (err.name === 'AbortError') throw err;
          if (i === retries) throw err;
        }
        await new Promise(resolve => setTimeout(resolve, delay));
      }
      return null;
    }

    async function fetchAllData() {
      if (isFetching) return;
      isFetching = true;

      if (activeAbortController) activeAbortController.abort();
      activeAbortController = new AbortController();
      const { signal } = activeAbortController;

      errorDiv.style.display = 'none';
      locationText.innerText = `${currentLocationLabel} (Gathering complete data...)`;

      const startDate = new Date().toISOString().split('T')[0];
      const dEnd = new Date(startDate);
      dEnd.setDate(dEnd.getDate() + 6);
      const endDate = dEnd.toISOString().split('T')[0];

      const hours = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);

      const fetchPromises = MODEL_CONFIG.map(async (model) => {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLng}&hourly=temperature_2m,precipitation,windspeed_10m&start_date=${startDate}&end_date=${endDate}&timezone=auto&models=${model.id}`;
        try {
          const json = await fetchWithRetry(url, signal);
          if (!json || !json.hourly || !json.hourly.time) return null;

          const temps = json.hourly[`temperature_2m_${model.id}`] || json.hourly['temperature_2m'] || [];
          const rains = json.hourly[`precipitation_${model.id}`] || json.hourly['precipitation'] || [];
          const rawWinds = json.hourly[`windspeed_10m_${model.id}`] || json.hourly['windspeed_10m'] || [];
          const windsMph = rawWinds.map(w => w !== null ? w * 0.621371 : null);

          return { modelId: model.id, temps, rains, winds: windsMph };
        } catch (err) {
          if (err.name === 'AbortError') return null;
          return null;
        }
      });

      let results;
      try {
        results = await Promise.all(fetchPromises);
      } catch (err) {
        isFetching = false;
        return;
      }

      if (signal.aborted) {
        isFetching = false;
        return;
      }

      locationText.innerText = currentLocationLabel;
      isFetching = false;

      const validResults = results.filter(r => r !== null);
      if (validResults.length === 0) {
        errorDiv.innerText = 'Error loading forecast data. Please try another location.';
        errorDiv.style.display = 'block';
        return;
      }

      cachedResults = validResults;
      renderTextForecast(validResults, startDate);
      renderDailyChartForSelectedDate(validResults, hours);
    }

    function inferWeatherCondition(maxT, minT, rain, maxWind) {
      const tempRange = maxT - minT;

      if (maxWind >= 28) {
        return { label: 'Stormy / High Wind', class: 'cond-stormy' };
      } else if (rain >= 5.0) {
        return { label: 'Heavy Rain', class: 'cond-heavy-rain' };
      } else if (rain > 0.5) {
        return tempRange > 7 
          ? { label: 'Sun & Showers', class: 'cond-showers' } 
          : { label: 'Passing Showers', class: 'cond-showers' };
      } else {
        if (tempRange <= 4.5) {
          return { label: 'Overcast & Damp', class: 'cond-overcast' };
        } else if (tempRange >= 10) {
          return { label: 'Clear & Sunny', class: 'cond-clear' };
        } else {
          return { label: 'Partly Cloudy', class: 'cond-partly-cloudy' };
        }
      }
    }

    function renderTextForecast(allResults, startDate) {
      textForecastGrid.innerHTML = '';
      const daysCount = 7;

      for (let d = 0; d < daysCount; d++) {
        const targetDateObj = new Date(startDate);
        targetDateObj.setDate(targetDateObj.getDate() + d);
        const isoDate = targetDateObj.toISOString().split('T')[0];
        const dayLabel = d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : targetDateObj.toLocaleDateString('en-GB', { weekday: 'short' });

        let worstMax = -Infinity;
        let worstMin = Infinity;
        let worstRain = -1;
        let peakWind = 0;

        allResults.forEach(res => {
          const startIdx = d * 24;
          const endIdx = startIdx + 24;
          const dayTemps = res.temps.slice(startIdx, endIdx).filter(v => v !== null && v !== undefined);
          const dayRains = res.rains.slice(startIdx, endIdx).filter(v => v !== null && v !== undefined);
          const dayWinds = res.winds.slice(startIdx, endIdx).filter(v => v !== null && v !== undefined);

          if (dayTemps.length > 0 && dayRains.length > 0) {
            const maxT = Math.max(...dayTemps);
            const minT = Math.min(...dayTemps);
            const totalRain = dayRains.reduce((a, b) => a + b, 0);
            const maxW = dayWinds.length > 0 ? Math.max(...dayWinds) : 0;

            if (totalRain > worstRain || (totalRain === worstRain && minT < worstMin)) {
              worstMax = maxT;
              worstMin = minT;
              worstRain = totalRain;
              peakWind = Math.max(peakWind, maxW);
            }
          }
        });

        const col = document.createElement('div');
        col.className = `forecast-day-col ${isoDate === selectedDate ? 'active' : ''}`;
        col.dataset.date = isoDate;

        if (worstRain === -1) {
          col.innerHTML = `
            <div class="forecast-day-name">${dayLabel}</div>
            <div class="forecast-metric"><span class="label">No Data</span></div>
          `;
        } else {
          const condition = inferWeatherCondition(worstMax, worstMin, worstRain, peakWind);
          col.innerHTML = `
            <div class="forecast-day-name">${dayLabel}</div>
            <div class="forecast-condition ${condition.class}">${condition.label}</div>
            <div class="forecast-metric">
              <span class="label">Min / Max</span>
              <span class="val">${Math.round(worstMin)}° / ${Math.round(worstMax)}°</span>
            </div>
            <div class="forecast-metric rain">
              <span class="label">Rain</span>
              <span class="val">${worstRain.toFixed(1)}mm</span>
            </div>
            <div class="forecast-metric wind">
              <span class="label">Peak Wind</span>
              <span class="val">${Math.round(peakWind)} mph</span>
            </div>
          `;
        }

        col.addEventListener('click', () => {
          if (isFetching || !cachedResults) return;
          document.querySelectorAll('.forecast-day-col').forEach(c => c.classList.remove('active'));
          col.classList.add('active');
          selectedDate = isoDate;
          const hours = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);
          renderDailyChartForSelectedDate(cachedResults, hours);
        });

        textForecastGrid.appendChild(col);
      }
    }

    function renderDailyChartForSelectedDate(allResults, hours) {
      const startDate = new Date().toISOString().split('T')[0];
      const startMs = new Date(startDate).getTime();
      const selectedMs = new Date(selectedDate).getTime();
      const dayOffset = Math.round((selectedMs - startMs) / (1000 * 60 * 60 * 24));
      const safeOffset = Math.max(0, Math.min(6, dayOffset));

      const resultsMap = new Map();
      allResults.forEach(r => {
        const startIdx = safeOffset * 24;
        const endIdx = startIdx + 24;
        resultsMap.set(r.modelId, {
          temps: r.temps.slice(startIdx, endIdx),
          rains: r.rains.slice(startIdx, endIdx),
          winds: r.winds.slice(startIdx, endIdx)
        });
      });

      const datasets = [];

      MODEL_CONFIG.forEach(model => {
        const res = resultsMap.get(model.id);
        const temps = res ? res.temps : Array(24).fill(null);
        const rains = res ? res.rains : Array(24).fill(null);
        const winds = res ? res.winds : Array(24).fill(null);

        datasets.push({
          type: 'line',
          label: model.label,
          data: temps,
          backgroundColor: model.color,
          borderColor: model.color,
          pointRadius: 5,
          fill: false,
          borderWidth: 2,
          yAxisID: 'yTemp'
        });

        datasets.push({
          type: 'bar',
          label: `${model.label} (Rain)`,
          data: rains,
          backgroundColor: model.color + '66',
          borderColor: model.color,
          borderWidth: 1,
          borderRadius: 2,
          yAxisID: 'yRain'
        });

        datasets.push({
          type: 'line',
          label: `${model.label} (Wind)`,
          data: winds,
          borderColor: model.color,
          borderDash: [4, 4],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
          yAxisID: 'yWind'
        });
      });

      const ctx = document.getElementById('weatherChart').getContext('2d');
      if (weatherChartInstance) weatherChartInstance.destroy();

      weatherChartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels: hours, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
              labels: { 
                color: '#f5f5f5', 
                boxWidth: 14, 
                font: { size: 12, weight: '500' },
                padding: 12,
                filter: (legendItem) => !legendItem.text.includes('(Rain)') && !legendItem.text.includes('(Wind)')
              }
            },
            tooltip: {
              callbacks: {
                title: (items) => items.length ? `Time: ${items[0].label}` : '',
                label: (ctx) => {
                  const yAxis = ctx.dataset.yAxisID;
                  const labelName = ctx.dataset.label.replace(' (Rain)', '').replace(' (Wind)', '');
                  if (yAxis === 'yTemp') return `${labelName} (Temp): ${ctx.parsed.y}°C`;
                  if (yAxis === 'yRain') return `${labelName} (Rain): ${ctx.parsed.y} mm`;
                  return `${labelName} (Wind): ${Math.round(ctx.parsed.y)} mph`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#262626' },
              ticks: { color: '#a3a3a3', font: { size: 13 } }
            },
            yTemp: {
              type: 'linear',
              position: 'left',
              ticks: { color: '#f5f5f5' },
              grid: { color: '#262626' },
              title: { display: true, text: 'Temperature (°C)', color: '#f5f5f5', font: { weight: 'bold' } }
            },
            yRain: {
              type: 'linear',
              position: 'right',
              min: 0,
              max: 20,
              ticks: { color: '#60a5fa' },
              grid: { drawOnChartArea: false },
              title: { display: true, text: 'Rain (mm)', color: '#60a5fa', font: { weight: 'bold' } }
            },
            yWind: {
              type: 'linear',
              position: 'right',
              min: 0,
              grid: { drawOnChartArea: false },
              ticks: { color: '#34d399', font: { size: 11 } },
              title: { display: true, text: 'Wind (mph)', color: '#34d399', font: { weight: 'bold' } }
            }
          }
        },
        plugins: [nowMarkerPlugin]
      });
    }

    window.onload = init;
  </script>
</body>
</html>
