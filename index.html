<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Chart</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #050505;            /* Deep black canvas */
      --card-bg: #121212;       /* Subtle off-black cards */
      --border: #262626;        /* Subtle dark borders */
      --text: #f5f5f5;          /* Crisp light text */
      --muted: #a3a3a3;         /* Neutral grey labels */
      --accent: #3b82f6;        /* Clean accent blue */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .controls {
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }

    .search-group {
      position: relative;
      flex: 1;
      min-width: 320px;
      max-width: 520px;
    }

    .search-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .geo-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .geo-btn:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 6px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
      display: none;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--bg);
    }

    .suggestion-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-name {
      font-weight: 600;
      color: var(--text);
      font-size: 1.05rem;
    }

    .suggestion-coords {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: monospace;
    }

    .suggestion-details {
      font-size: 0.9rem;
      color: var(--accent);
    }

    .date-group {
      flex: 2;
      min-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .date-group label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
    }

    .date-buttons-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .date-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 95px;
    }

    .date-btn:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
    }

    .date-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 700;
    }

    .date-btn .btn-sub {
      font-size: 0.75rem;
      opacity: 0.85;
      font-weight: normal;
    }

    .location-info {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
      width: 100%;
      text-align: center;
      margin-top: 6px;
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 550px;
    }

    .error-msg {
      display: none;
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Weather Chart</h1>
    </header>

    <div class="controls">
      <!-- Search Box & Geolocation Button -->
      <div class="search-group">
        <label for="search-input">Search Location (Town/City/County):</label>
        <div class="search-input-wrapper">
          <input type="text" id="search-input" placeholder="..." autocomplete="off" />
          <button type="button" id="geo-btn" class="geo-btn" title="Use current location">📍</button>
          <div id="suggestions" class="suggestions-list"></div>
        </div>
      </div>

      <!-- Single Click Date Buttons -->
      <div class="date-group">
        <label>Select Day</label>
        <div class="date-buttons-wrapper" id="date-buttons-container"></div>
      </div>

      <div class="location-info" id="location-text">Loading location...</div>
    </div>

    <div id="error" class="error-msg"></div>

    <!-- Scaled Chart Container -->
    <div class="chart-card">
      <div class="chart-container">
        <canvas id="scatterChart"></canvas>
      </div>
    </div>

  </div>

  <script>
